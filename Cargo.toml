[package]
name = "renamer"
version = "0.1.0"
edition = "2021"
description = "Bulk file renamer and organizer with metadata-driven templates"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
kamadak-exif = "0.5"
chrono = "0.4"
rfd = "0.14"
anyhow = "1"
walkdir = "2"

[profile.release]
opt-level = 2
