name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # eframe needs these dev libs to build on Linux runners.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb1-dev

      - name: Build
        run: cargo build --all-targets

      # The catalog, thumbnail and quarantine tests exercise real files, so give
      # them scratch directories rather than the runner's home.
      - name: Test
        env:
          RENAMER_DATA_DIR: ${{ runner.temp }}/renamer-data
          RENAMER_CACHE_DIR: ${{ runner.temp }}/renamer-cache
        run: cargo test -- --nocapture
